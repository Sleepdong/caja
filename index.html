<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://cdn.jsdelivr.net 'wasm-unsafe-eval' 'sha256-KEejA6vqqx3o/MHYl5bkP5Ffbuzs0wIgjB0TlXRJawA='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; worker-src blob:; connect-src https://keygysddihxgukmdggyy.supabase.co wss://keygysddihxgukmdggyy.supabase.co https://cdn.jsdelivr.net; base-uri 'none'; form-action 'none'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<title>Caja · Gestión Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.1/dist/umd/supabase.js" integrity="sha384-2DeuFKyqIlpZfFmj+jl/+IbM3DwDM4vGKsvK0fI32E0ZDt24W33hB6pka4RAdbz2" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous"></script>
<style>
:root{
  --tinta:#231942; --tinta2:#3a2e63; --papel:#eef0f5; --blanco:#fff; --linea:#dcdfe8; --gris:#6b6880;
  --rotulo:#ffc93c; --rotulo2:#f2b51b;
  --yape:#6b1e86; --plin:#0ba5a4; --efectivo:#2e7d4f; --tarjeta:#2d5bd7;
  --alerta:#d1432f; --ok:#2e7d4f; --aviso:#b7791f;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --ui:"Instrument Sans",system-ui,sans-serif;
  --r-s:8px; --r-m:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--ui);background:var(--papel);color:var(--tinta);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rotulo);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Barra superior ---------- */
.top{background:var(--tinta);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 20px;flex-wrap:wrap}
.marca{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.marca i{width:30px;height:30px;border-radius:9px;background:var(--rotulo);display:grid;place-items:center;color:var(--tinta);font-style:normal;font-size:16px}
.fecha{opacity:.7;font-size:13px}.fecha::first-letter{text-transform:uppercase}
.esp{flex:1}
.estado-caja{border:0;border-radius:999px;padding:6px 12px 6px 10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;background:#ffffff1a;color:#fff}
.estado-caja::before{content:"";width:9px;height:9px;border-radius:50%;background:#ff7a6b}
.estado-caja.abierta::before{background:#5ee08f}
.usuario{font-size:13px;opacity:.8}
.salir{background:none;border:1px solid #ffffff40;color:#fff;border-radius:var(--r-s);padding:5px 10px;font-size:13px;cursor:pointer}
.tabs{display:flex;gap:2px;background:var(--tinta);padding:0 14px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;color:#c9c4dc;padding:10px 14px 12px;font-size:14px;font-weight:600;cursor:pointer;border-radius:10px 10px 0 0;white-space:nowrap}
.tabs button:hover{color:#fff}
.tabs button.on{background:var(--papel);color:var(--tinta)}
main{max-width:1240px;margin:0 auto;padding:20px}

/* ---------- Bloques ---------- */
.panel{background:var(--blanco);border-radius:var(--r-m);padding:18px 20px;margin-bottom:18px;border:1px solid var(--linea)}
.panel>h2,.titulo{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
.sub{color:var(--gris);font-size:13.5px;margin:0 0 14px}
h3{font-size:14px;font-weight:700;margin:18px 0 8px}
.cols{display:grid;gap:18px}
@media(min-width:900px){.cols.dos{grid-template-columns:1fr 1fr}.cols.pos{grid-template-columns:minmax(0,1fr) 400px;align-items:start}}
.fila{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fila>*{flex:1 1 140px}
.fila>.auto{flex:0 0 auto}
label{display:block;font-size:12.5px;font-weight:600;color:var(--gris);margin-bottom:4px}
input,select{width:100%;padding:9px 11px;border:1.5px solid var(--linea);border-radius:var(--r-s);background:#fff;font-size:15px}
input:focus,select:focus{border-color:var(--tinta2);outline:none;box-shadow:0 0 0 3px #3a2e6322}
.btn{border:0;border-radius:var(--r-s);padding:10px 16px;font-weight:700;font-size:14.5px;cursor:pointer;background:var(--tinta);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{background:var(--tinta2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.claro{background:#e9e8f1;color:var(--tinta)}
.btn.claro:hover{background:#dddbe9}
.btn.peligro{background:var(--alerta)}
.btn.mini{padding:5px 10px;font-size:12.5px;font-weight:600}
.btn.rotulo{background:var(--rotulo);color:var(--tinta)}
.btn.rotulo:hover{background:var(--rotulo2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:600;color:var(--gris);text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--linea)}
td{padding:9px 8px;border-bottom:1px solid #eceef3;vertical-align:middle}
tr:last-child td{border-bottom:0}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#eceaf3;color:var(--tinta2);white-space:nowrap}
.chip.ok{background:#dff3e7;color:#1f6b40}.chip.mal{background:#fbe3df;color:#a8321f}.chip.aviso{background:#fdf0d3;color:#8a5a0c}
.vacio{color:var(--gris);padding:18px 0;text-align:center}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.cifra{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r-m);padding:14px 16px}
.cifra small{display:block;color:var(--gris);font-size:12.5px;font-weight:600}
.cifra b{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.aviso-barra{background:#fff4d6;border:1px solid #f3d27a;border-radius:var(--r-m);padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.aviso-barra p{margin:0;flex:1 1 220px}

/* ---------- Punto de venta ---------- */
.buscador{position:relative;margin-bottom:14px}
.buscador input{padding:12px 14px 12px 40px;font-size:16px;border-radius:12px}
.buscador svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}
.estante{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.prod{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r-m);padding:14px;display:flex;flex-direction:column;gap:10px}
.prod h4{margin:0;font-family:var(--display);font-size:16.5px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.prod .stock{font-size:12.5px;color:var(--gris)}
.prod .stock.bajo{color:var(--alerta);font-weight:600}
.prod .opciones{display:grid;gap:6px}
.opc{border:1.5px solid var(--linea);background:#fafafd;border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;text-align:left;transition:border-color .12s,background .12s}
.opc:hover{border-color:var(--tinta2);background:#f3f1fa}
.opc:active{transform:scale(.98)}
.opc:disabled{opacity:.4;cursor:not-allowed}
.opc span{font-size:13.5px;font-weight:600}
.opc b{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.opc .cnt{background:var(--tinta);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:6px}

/* El ticket: el único elemento con personalidad propia */
.ticket{background:var(--blanco);border-radius:4px 4px var(--r-m) var(--r-m);position:sticky;top:12px;filter:drop-shadow(0 10px 24px #23194218)}
.ticket::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px;
  background:radial-gradient(circle at 6px 0,transparent 5px,var(--blanco) 5.5px) -6px 0/12px 8px repeat-x}
.ticket .cab{padding:16px 18px 10px;border-bottom:2px dashed var(--linea);display:flex;justify-content:space-between;align-items:baseline}
.ticket .cab h2{font-family:var(--display);font-size:20px;margin:0}
.ticket .cab small{color:var(--gris)}
.lineas{padding:6px 18px;max-height:290px;overflow:auto}
.linea{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid #f0f0f4}
.linea:last-child{border:0}
.linea .nom{font-weight:600;font-size:14px}
.linea .imp{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.linea .ctrl{display:flex;align-items:center;gap:6px;color:var(--gris);font-size:13px}
.paso{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--linea);background:#fff;cursor:pointer;font-weight:700;font-size:16px;line-height:1;display:grid;place-items:center}
.paso:hover{border-color:var(--tinta2)}
.linea .cant{min-width:24px;text-align:center;font-weight:700;color:var(--tinta)}
.linea .pu{width:74px;padding:4px 6px;font-size:13px}
.quitar{border:0;background:none;color:var(--gris);cursor:pointer;font-size:12.5px;text-decoration:underline;padding:0;justify-self:end}
.ticket .pie{padding:14px 18px 18px;border-top:2px dashed var(--linea)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.total span{font-weight:600;color:var(--gris)}
.total b{font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.medios{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.medio{border:2px solid var(--linea);background:#fff;border-radius:12px;padding:10px 6px;cursor:pointer;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.medio i{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:13px;font-weight:800}
.medio[data-c=EFECTIVO] i{background:var(--efectivo)}.medio[data-c=YAPE] i{background:var(--yape)}.medio[data-c=PLIN] i{background:var(--plin)}
.medio.on[data-c=EFECTIVO]{border-color:var(--efectivo);background:#eef8f2}
.medio.on[data-c=YAPE]{border-color:var(--yape);background:#f6edf9}
.medio.on[data-c=PLIN]{border-color:var(--plin);background:#e8f8f8}
.rapidos{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.rapidos button{flex:1 1 0;border:1.5px solid var(--linea);background:#fff;border-radius:8px;padding:7px 4px;font-weight:600;font-size:13.5px;cursor:pointer;min-width:52px}
.rapidos button:hover{border-color:var(--efectivo)}
.vuelto{display:flex;justify-content:space-between;background:#eef8f2;border-radius:10px;padding:10px 12px;margin:6px 0 12px;font-weight:600}
.vuelto b{font-family:var(--display);font-size:22px;color:var(--efectivo)}
.vuelto.falta{background:#fbe3df}.vuelto.falta b{color:var(--alerta)}
.cobrar{width:100%;padding:15px;font-size:17px;border-radius:12px}
.extra{margin-top:10px;font-size:13.5px}
.extra summary{cursor:pointer;color:var(--gris);font-weight:600}
.hecho{text-align:center;padding:28px 18px}
.hecho .ic{width:56px;height:56px;border-radius:50%;background:#dff3e7;color:var(--ok);display:grid;place-items:center;margin:0 auto 10px;font-size:28px}
.hecho b{font-family:var(--display);font-size:34px;display:block}
.resumen-dia{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.resumen-dia div{flex:1 1 90px;background:var(--blanco);border:1px solid var(--linea);border-radius:10px;padding:8px 10px}
.resumen-dia small{display:block;font-size:12px;color:var(--gris);font-weight:600}
.resumen-dia b{font-variant-numeric:tabular-nums}
.punto{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}


/* ---------- Panel ---------- */
.heroe{background:var(--tinta);color:#fff;border-radius:var(--r-m);padding:22px 24px;display:grid;gap:18px;margin-bottom:18px}
@media(max-width:899px){.heroe{grid-template-columns:1fr 1fr}.heroe>div:first-child{grid-column:1/-1}.heroe .med{font-size:24px}}
@media(min-width:900px){.heroe{grid-template-columns:1.1fr 1fr 1fr 1fr;align-items:end}}
.heroe small{display:block;font-size:13px;color:#c9c4dc;font-weight:600}
.heroe .grande{font-family:var(--display);font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.heroe .med{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.heroe .cmp{font-size:13px;margin-top:6px;color:#c9c4dc}
.sube{color:#7ee2a8;font-weight:700}.baja{color:#ff9b8f;font-weight:700}
.cifra .cmp{font-size:12.5px;color:var(--gris);margin-top:2px}
.cifra .sube{color:var(--ok)}.cifra .baja{color:var(--alerta)}
.grafico{position:relative}
.grafico svg{display:block;width:100%;height:auto;overflow:visible}
.grafico .eje{font-size:11px;fill:var(--gris);font-family:var(--ui)}
.grafico .rejilla{stroke:#eceef3;stroke-width:1}
.grafico .barra{cursor:pointer}
.grafico .barra:hover rect.v{opacity:.82}
.leyenda{display:flex;gap:16px;font-size:13px;color:var(--gris);margin:-4px 0 10px}
.leyenda span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.tip{position:absolute;pointer-events:none;background:var(--tinta);color:#fff;border-radius:8px;padding:7px 10px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;opacity:0;transition:opacity .1s;z-index:5}
.tip.ver{opacity:1}
.tip b{font-variant-numeric:tabular-nums}
.barra-medio{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:6px 0 12px;background:#eceef3}
.barra-medio div{height:100%}

/* ---------- Margen ---------- */
.mg{display:block;font-size:11.5px;font-weight:600;color:var(--gris);margin-top:1px}
.mg.bajo{color:var(--aviso)}.mg.perdida{color:var(--alerta)}
.cant-in{width:58px;padding:4px 6px;font-size:14px;font-weight:700;text-align:center}
.alerta-linea{grid-column:1/-1;font-size:12.5px;border-radius:8px;padding:5px 8px;margin-top:2px}
.alerta-linea.bajo{background:#fdf0d3;color:#7a520f}.alerta-linea.perdida{background:#fbe3df;color:#a8321f}
.ganancia-est{display:flex;justify-content:space-between;font-size:13.5px;color:var(--gris);margin:-8px 0 12px}
.ganancia-est b{color:var(--tinta);font-variant-numeric:tabular-nums}
.panel.alerta{border-color:#f3d27a;background:#fffbef}
/* ---------- Escáner de facturas ---------- */
.escaner{border:2px dashed #c9c4dc;border-radius:var(--r-m);padding:14px;margin-bottom:14px;background:#faf9fd}
.escaner .cab-esc{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.escaner img.prev{width:150px;max-height:210px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--linea);cursor:zoom-in}
.escaner img.prev.grande{width:100%;max-height:none;cursor:zoom-out}
.progreso{height:8px;background:#e9e7f2;border-radius:6px;overflow:hidden;margin:8px 0}
.progreso div{height:100%;background:var(--tinta2);width:0;transition:width .2s}
.lin-esc td{vertical-align:top}
.lin-esc .txt{font-size:12.5px;color:var(--gris);max-width:260px}
.lin-esc tr.off td{opacity:.45}
.cuadre{border-radius:10px;padding:9px 12px;margin:10px 0;font-size:14px}
.cuadre.ok{background:#dff3e7;color:#1f6b40}.cuadre.mal{background:#fdf0d3;color:#7a520f}
/* ---------- Cuenta / 2FA ---------- */
.qr{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin:12px 0}
.qr img{width:190px;height:190px;background:#fff;border:1px solid var(--linea);border-radius:12px;padding:8px}
.clave{font-family:var(--display);font-size:15px;letter-spacing:.06em;word-break:break-all;background:#f3f1fa;border-radius:8px;padding:8px 10px;margin:6px 0}
.pasos{margin:0;padding-left:20px}.pasos li{margin-bottom:6px}
/* ---------- Diálogos y avisos ---------- */
#aviso{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--tinta);color:#fff;padding:12px 18px;border-radius:12px;max-width:min(92vw,520px);font-size:14.5px;font-weight:500;z-index:60;transition:.2s;pointer-events:none}
#aviso.ver{opacity:1;transform:translateX(-50%)}
#aviso.error{background:var(--alerta)}
.velo{position:fixed;inset:0;background:#23194266;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dialogo{background:#fff;border-radius:16px;padding:20px;width:min(460px,100%);max-height:90vh;overflow:auto}
.dialogo h3{font-family:var(--display);font-size:19px;margin:0 0 14px}
.dialogo .campo{margin-bottom:12px}
.dialogo .acc{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* ---------- Ingreso ---------- */
#ingreso{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--tinta)}
#ingreso form{background:#fff;border-radius:18px;padding:28px;width:min(380px,100%)}
#ingreso .marca{color:var(--tinta);margin-bottom:18px}
#ingreso .campo{margin-bottom:12px}
.oculto{display:none!important}
#barraMovil{display:none}
@media(max-width:899px){#barraMovil.ver{display:flex;position:fixed;left:10px;right:10px;bottom:10px;z-index:30;background:var(--tinta);color:#fff;border-radius:14px;padding:10px 10px 10px 16px;align-items:center;gap:10px;box-shadow:0 8px 24px #23194255}
#barraMovil b{font-family:var(--display);font-size:22px;flex:1}#barraMovil small{opacity:.7;display:block;font-size:12px}}
@media(max-width:600px){.usuario{display:none}.opc{flex-direction:column;align-items:flex-start;gap:2px}.opc b{font-size:16px}.prod h4{font-size:15px}.cols.pos{padding-bottom:70px}
main{padding:12px}.panel{padding:14px}.top{padding:10px 14px}.fecha{display:none}.estante{grid-template-columns:1fr 1fr}.prod{padding:10px}.opc{padding:7px 8px}.opc b{font-size:15px}.ticket{position:static}}
</style>
</head>
<body>

<div id="ingreso">
  <form id="fIngreso">
    <div class="marca"><i>S/</i>Caja</div>
    <div class="campo"><label for="lEmail">Correo</label><input type="email" id="lEmail" required autocomplete="username"></div>
    <div class="campo"><label for="lPass">Contraseña</label><input type="password" id="lPass" required autocomplete="current-password"></div>
    <button class="btn" style="width:100%;padding:12px">Entrar</button>
    <p style="margin:14px 0 0;font-size:13.5px;text-align:center"><a href="#" id="olvide" style="color:var(--tinta2)">Olvidé mi contraseña</a></p>
  </form>
  <form id="fCodigo" class="oculto">
    <div class="marca"><i>S/</i>Caja</div>
    <h2 style="font-family:var(--display);font-size:21px;margin:0 0 6px">Código de verificación</h2>
    <p class="sub">Abre tu app autenticadora y escribe el código de 6 dígitos de <b>Caja</b>.</p>
    <div class="campo"><input id="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" aria-label="Código de 6 dígitos" style="font-size:28px;letter-spacing:.35em;text-align:center;font-family:var(--display)"></div>
    <button type="submit" class="btn" style="width:100%;padding:12px">Verificar</button>
    <p style="margin:14px 0 0;font-size:13.5px;text-align:center"><a href="#" id="cancelarCodigo" style="color:var(--tinta2)">Salir y usar otra cuenta</a></p>
  </form>
</div>

<div id="app" class="oculto">
  <div class="top">
    <div class="marca"><i>S/</i>Caja</div>
    <span class="fecha" id="fechaHoy"></span>
    <span class="esp"></span>

// Gráfico de barras en SVG (una o dos series, mismo eje en soles)
function barras(cont, etiquetas, series, opts = {}) {
  const W = 640, H = opts.alto || 220, m = { t: 12, r: 8, b: 26, l: 46 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const max = Math.max(1, ...series.flatMap(s => s.valores));
  const paso = (() => { const r = max / 4, e = 10 ** Math.floor(Math.log10(r)), f = r / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e; })();
  const tope = Math.ceil(max / paso) * paso;
  const y = v => m.t + ih - (v / tope) * ih;
  const grupo = iw / etiquetas.length, gap = 2, nb = series.length;
  const bw = Math.min(28, (grupo * 0.7 - gap * (nb - 1)) / nb);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.titulo || '')}">`;
  for (let v = 0; v <= tope + 1e-9; v += paso) svg += `<line class="rejilla" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text class="eje" x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v >= 1000 ? N(v / 1000, 1) + 'k' : N(v)}</text>`;
  const cadaN = Math.ceil(etiquetas.length / 12);
  etiquetas.forEach((et, i) => {
    const x0 = m.l + grupo * i + (grupo - (bw * nb + gap * (nb - 1))) / 2;
    svg += `<g class="barra" data-i="${i}"><rect x="${m.l + grupo * i}" y="${m.t}" width="${grupo}" height="${ih}" fill="transparent"/>`;
    series.forEach((s, k) => {
      const v = Math.max(0, s.valores[i]), h = ih - (y(v) - m.t), x = x0 + k * (bw + gap), r = Math.min(4, bw / 2, h);
      if (h > 0) svg += `<path class="v" fill="${s.color}" d="M${x},${m.t + ih}V${y(v) + r}Q${x},${y(v)} ${x + r},${y(v)}H${x + bw - r}Q${x + bw},${y(v)} ${x + bw},${y(v) + r}V${m.t + ih}Z"/>`;
    });
    svg += `</g>`;
    if (i % cadaN === 0) svg += `<text class="eje" x="${m.l + grupo * i + grupo / 2}" y="${H - 8}" text-anchor="middle">${esc(et)}</text>`;
  });
  svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="#c9ccd8"/></svg>`;
  cont.innerHTML = `<div class="grafico">${svg}<div class="tip"></div></div>`;
  const tip = cont.querySelector('.tip'), caja = cont.querySelector('.grafico');
  cont.querySelectorAll('.barra').forEach(g => {
    const i = Number(g.dataset.i);
    const mostrar = () => {
      const r = g.getBoundingClientRect(), rc = caja.getBoundingClientRect();
      const top = Math.min(...[...g.querySelectorAll('path')].map(p => p.getBoundingClientRect().top), r.bottom - 26);
      tip.innerHTML = `${esc(opts.tituloTip ? opts.tituloTip(i) : etiquetas[i])}<br>` + series.map(s => `${esc(s.nombre)}: <b>${S(s.valores[i])}</b>`).join('<br>');
      tip.style.left = (r.left + r.width / 2 - rc.left) + 'px'; tip.style.top = (top - rc.top) + 'px'; tip.classList.add('ver');
    };
    g.onmouseenter = mostrar; g.onclick = mostrar; g.onmouseleave = () => tip.classList.remove('ver');
  });
}

  <div class="cols dos">
    <div class="panel"><h2>Qué te dejó más ganancia hoy</h2>${top.length ? `<div class="scroll"><table><tr><th>Producto</th><th class="n">Unidades</th><th class="n">Venta</th><th class="n">Ganancia</th><th class="n">Margen</th></tr>
      ${top.map(([k, o]) => `<tr><td>${esc(nomProd[k] || '')}</td><td class="n">${N(o.c)}</td><td class="n">${S(o.v)}</td><td class="n"><b>${S(o.v - o.k)}</b></td><td class="n">${o.v > 0 ? P((o.v - o.k) / o.v * 100) : '—'}</td></tr>`).join('')}</table></div>`
      : '<p class="vacio">Cuando vendas, aquí verás qué producto rinde más.</p>'}</div>
    <div class="panel"><h2>Cómo te pagaron hoy</h2>
      ${totMedios ? `<div class="barra-medio" role="img" aria-label="Reparto por medio de pago">${medios(MEDIOS_VENTA).filter(m => porMedio[m.id] > 0).map(m => `<div style="width:${porMedio[m.id] / totMedios * 100}%;background:${COLOR_MEDIO[m.codigo]}" title="${esc(m.nombre)}"></div>`).join('')}</div>` : '<p class="sub">Aún no hay cobros hoy.</p>'}
      <table>${medios(MEDIOS_VENTA).map(m => `<tr><td><span class="punto" style="background:${COLOR_MEDIO[m.codigo]}"></span>${esc(m.nombre)}</td><td class="n">${S(porMedio[m.id])}</td><td class="n sub">${totMedios ? P(num(porMedio[m.id]) / totMedios * 100) : ''}</td></tr>`).join('')}</table>

  barras($('#g7'), ult7.map(nomDia), [

    { nombre: 'Ganancia', color: COL_GAN, valores: ult7.map(f => gb(dia(f))) }], { alto: 200, titulo: 'Venta y ganancia de los últimos 7 días' });

// ============ VENDER ============
let ticket = [];               // {presentacion_id, producto_id, nombre, factor, cantidad, precio, lista}
let medioVenta = 'EFECTIVO';
async function vVender(el) {
  const [precios, stock, ses, cobrosHoy] = await Promise.all([
    q(sb.from('v_precios_vigentes').select('*')),
    q(sb.from('v_existencias').select('producto_id,cantidad,stock_minimo,costo_promedio')),
    pintarEstadoCaja(),
    q(sb.from('movimientos_financieros').select('monto, metodo_pago_id').in('tipo', ['COBRO_VENTA', 'REEMBOLSO_CLIENTE']).gte('fecha', inicioHoy())),
  ]);
  const stk = Object.fromEntries(stock.map(s => [s.producto_id, s]));
  const productos = {};
  precios.filter(p => p.precio != null).forEach(p => (productos[p.producto_id] ??= { id: p.producto_id, nombre: p.producto, ops: [] }).ops.push(p));
  const lista = Object.values(productos).sort((a, b) => a.nombre.localeCompare(b.nombre));
  lista.forEach(p => p.ops.sort((a, b) => a.factor - b.factor));
  const costoDe = (prodId, factor) => r2(num(stk[prodId]?.costo_promedio) * num(factor));
  const generico = C.clientes.find(c => c.es_generico);
  const credito = C.clientes.filter(c => c.permite_credito);
  const porMedio = {}; cobrosHoy.forEach(m => porMedio[m.metodo_pago_id] = (porMedio[m.metodo_pago_id] || 0) + num(m.monto));

  el.innerHTML = `
  ${ses ? '' : `<div class="aviso-barra"><p><b>La caja está cerrada.</b> Puedes cobrar con Yape o Plin, pero para recibir efectivo tienes que abrirla.</p><button class="btn rotulo" id="abrirAqui">Abrir caja</button></div>`}
  <div class="cols pos">
    <section>
      <div class="buscador"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="buscar" placeholder="Buscar producto o escanear código" autocomplete="off"></div>
      <div class="estante" id="estante"></div>
      <div class="resumen-dia">${medios(MEDIOS_VENTA).map(m => `<div><small><span class="punto" style="background:${COLOR_MEDIO[m.codigo]}"></span>${esc(m.nombre)} hoy</small><b>${S(porMedio[m.id])}</b></div>`).join('')}
        <div><small>Total vendido hoy</small><b>${S(Object.values(porMedio).reduce((a, b) => a + b, 0))}</b></div></div>
    </section>
    <aside class="ticket" id="ticket"></aside>
  </div>`;
  $('#abrirAqui') && ($('#abrirAqui').onclick = async () => { if (await abrirCajaRapido()) ir('vender'); });

  const enTicket = (prodId) => ticket.filter(t => t.producto_id === prodId).reduce((a, t) => a + t.cantidad * t.factor, 0);
  const pintarEstante = () => {
    const f = $('#buscar').value.trim().toLowerCase();
    const vis = lista.filter(p => !f || p.nombre.toLowerCase().includes(f) || p.ops.some(o => o.codigo_barras === f));
    $('#estante').innerHTML = vis.map(p => {
      const s = stk[p.id], base = num(s?.cantidad) - enTicket(p.id), caj = Math.max(...p.ops.map(o => num(o.factor)));
      const bajo = num(s?.cantidad) <= num(s?.stock_minimo);
      const pq = Math.floor(base / caj), su = base % caj;
      const txtStock = base <= 0 ? 'Sin stock' : caj > 1 ? 'Quedan ' + [pq ? `${pq} ${pq === 1 ? 'paquete' : 'paquetes'}` : '', su ? `${N(su)} ${su === 1 ? 'suelto' : 'sueltos'}` : ''].filter(Boolean).join(' y ') : `Quedan ${N(base)}`;
      return `<div class="prod"><div><h4>${esc(p.nombre)}</h4><div class="stock ${bajo || base <= 0 ? 'bajo' : ''}">${txtStock}</div></div>
        <div class="opciones">${p.ops.map(o => { const c = ticket.find(t => t.presentacion_id === o.presentacion_id)?.cantidad;
          return `<button class="opc" data-p="${o.presentacion_id}" ${base < num(o.factor) ? 'disabled' : ''}><span>${esc(o.presentacion)}${c ? `<em class="cnt">${c}</em>` : ''}${(e => e ? `<small class="mg ${e.nivel}">${e.nivel === 'perdida' ? 'bajo el costo' : 'ganas ' + P(e.m)}</small>` : '')(evalMargen(num(o.precio), costoDe(o.producto_id, o.factor)))}</span><b>${S(o.precio)}</b></button>`; }).join('')}</div></div>`;
    }).join('') || '<p class="vacio">No hay productos con ese nombre.</p>';
    $('#estante').querySelectorAll('.opc').forEach(b => b.onclick = () => {
      const o = precios.find(x => x.presentacion_id === b.dataset.p);
      const t = ticket.find(x => x.presentacion_id === o.presentacion_id);
      if (t) t.cantidad++; else ticket.push({ presentacion_id: o.presentacion_id, producto_id: o.producto_id, nombre: `${o.producto}`, pres: o.presentacion, factor: num(o.factor), cantidad: 1, precio: num(o.precio), lista: num(o.precio) });
      pintarTodo();
    });
  };
  const total = () => r2(ticket.reduce((a, t) => a + r2(t.cantidad * t.precio), 0));
  let recibido = '', cond = 'CONTADO';

  const pintarTicket = () => {
    const t = total();
    const ef = medioVenta === 'EFECTIVO';
    const rec = num(recibido), vuelto = r2(rec - (cond === 'CREDITO' ? num($('#inicial')?.value) : t));
    $('#ticket').innerHTML = `
      <div class="cab"><h2>Venta</h2><small>${ticket.length ? (n => n + (n === 1 ? ' artículo' : ' artículos'))(ticket.reduce((a, x) => a + x.cantidad, 0)) : ''}</small></div>
      <div class="lineas">${ticket.length ? ticket.map((x, i) => `<div class="linea">
          <div class="nom">${esc(x.nombre)}<div class="sub" style="margin:0;font-weight:400">${esc(x.pres)}</div></div><div class="imp">${S(x.cantidad * x.precio)}</div>
          <div class="ctrl"><button class="paso" data-m="${i}" aria-label="Quitar uno">−</button><input class="cant-in" type="number" min="1" step="1" inputmode="numeric" value="${x.cantidad}" data-c="${i}" aria-label="Cantidad"><button class="paso" data-s="${i}" aria-label="Agregar uno">+</button>
            × <input class="pu" type="number" step="0.10" min="0" inputmode="decimal" value="${x.precio.toFixed(2)}" data-pu="${i}" aria-label="Precio unitario"></div>
          <button class="quitar" data-q="${i}">Quitar</button>
          ${(e => e && e.nivel !== 'ok' ? `<div class="alerta-linea ${e.nivel}">${e.nivel === 'perdida' ? `Vendes bajo el costo: te cuesta ${S(costoDe(x.producto_id, x.factor))}` : `Margen ${P(e.m)}, debajo de tu mínimo de ${P(umbral())}`}</div>` : '')(evalMargen(x.precio, costoDe(x.producto_id, x.factor)))}</div>`).join('')
        : '<p class="vacio">Toca un producto para agregarlo.</p>'}</div>
      <div class="pie">
        <div class="total"><span>Total</span><b>${S(t)}</b></div>
        ${t > 0 ? (() => { const k = ticket.reduce((a, x) => a + x.cantidad * costoDe(x.producto_id, x.factor), 0), g = t - k; return k > 0 ? `<div class="ganancia-est"><span>Ganancia de esta venta</span><b>${S(g)} · ${P(g / t * 100)}</b></div>` : ''; })() : ''}
        <div class="medios">${medios(MEDIOS_VENTA).map(m => `<button class="medio ${m.codigo === medioVenta ? 'on' : ''}" data-c="${m.codigo}"><i>${m.nombre[0]}</i>${esc(m.nombre)}</button>`).join('')}</div>
        ${ef && t > 0 && cond === 'CONTADO' ? `<label for="recibido">Recibes</label><input id="recibido" type="number" inputmode="decimal" step="0.10" min="0" value="${recibido}" placeholder="${t.toFixed(2)}">
          <div class="rapidos">${[...new Set([t, 10, 20, 50, 100, 200].filter(x => x >= t))].slice(0, 5).map(x => `<button data-r="${x}">${x === t ? 'Exacto' : 'S/ ' + x}</button>`).join('')}</div>
          ${rec > 0 ? `<div class="vuelto ${vuelto < 0 ? 'falta' : ''}"><span>${vuelto < 0 ? 'Falta' : 'Vuelto'}</span><b>${S(Math.abs(vuelto))}</b></div>` : ''}` : ''}
        ${!ef && t > 0 ? `<label for="opRef">N.° de operación (opcional)</label><input id="opRef" inputmode="numeric" placeholder="Para ubicar el pago después" style="margin-bottom:12px">` : ''}
        ${cond === 'CREDITO' ? `<div class="fila" style="margin-bottom:12px"><div><label>Cliente</label><select id="cliCred">${credito.map(c => `<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}</select></div>
          <div><label>Paga el</label><input type="date" id="vence" value="${masDias(15)}"></div><div><label>A cuenta hoy</label><input type="number" id="inicial" min="0" step="0.10" value="0" inputmode="decimal"></div></div>` : ''}
        <button class="btn rotulo cobrar" id="btnCobrar" ${t > 0 ? '' : 'disabled'}>${cond === 'CREDITO' ? 'Registrar fiado' : 'Cobrar ' + S(t)}</button>
        ${credito.length ? `<details class="extra" ${cond === 'CREDITO' ? 'open' : ''}><summary>Venta al fiado</summary>
          <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:14px;color:var(--tinta)"><input type="checkbox" id="esCred" style="width:auto" ${cond === 'CREDITO' ? 'checked' : ''}> El cliente paga después</label></details>` : ''}
      </div>`;
    const tk = $('#ticket');
    tk.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const x = ticket[b.dataset.m]; x.cantidad > 1 ? x.cantidad-- : ticket.splice(b.dataset.m, 1); pintarTodo(); });
    tk.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
      const x = ticket[b.dataset.s], s = num(stk[x.producto_id]?.cantidad);
      if (enTicket(x.producto_id) + x.factor > s) return aviso('No hay más stock de ' + x.nombre, true);
      x.cantidad++; pintarTodo();
    });
    tk.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { ticket.splice(b.dataset.q, 1); pintarTodo(); });
    tk.querySelectorAll('input[data-c]').forEach(inp => {
      inp.onfocus = () => inp.select();
      inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); };
      inp.onchange = () => {
        const x = ticket[inp.dataset.c]; let n = Math.floor(num(inp.value));
        if (n <= 0) { ticket.splice(inp.dataset.c, 1); return setTimeout(pintarTodo); }
        const otros = enTicket(x.producto_id) - x.cantidad * x.factor, max = Math.floor((num(stk[x.producto_id]?.cantidad) - otros) / x.factor);
        if (n > max) { aviso(`Solo hay stock para ${max} de ${x.nombre} (${x.pres})`, true); n = max; }
        if (n <= 0) ticket.splice(inp.dataset.c, 1); else x.cantidad = n;
        setTimeout(pintarTodo);
      };
    });
    tk.querySelectorAll('[data-pu]').forEach(i => i.onchange = () => { ticket[i.dataset.pu].precio = r2(Math.max(0, num(i.value))); setTimeout(pintarTicket); });
    tk.querySelectorAll('.medio').forEach(b => b.onclick = () => { medioVenta = b.dataset.c; pintarTicket(); });
    tk.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { recibido = b.dataset.r; pintarTicket(); });
    const ri = $('#recibido'); if (ri) ri.oninput = () => { recibido = ri.value; const pos = ri.selectionStart; pintarTicket(); const n = $('#recibido'); n.focus(); try { n.setSelectionRange(pos, pos); } catch {} };
    const ec = $('#esCred'); if (ec) ec.onchange = () => { cond = ec.checked ? 'CREDITO' : 'CONTADO'; pintarTicket(); };
    $('#btnCobrar').onclick = cobrar;
  };
  const pintarTodo = () => {
    pintarEstante(); pintarTicket();
    $('#barraMovil').classList.toggle('ver', ticket.length > 0);
    $('#bmTotal').textContent = S(total());
  };
  $('#bmIr').onclick = () => $('#ticket').scrollIntoView({ behavior: 'smooth' });

  async function cobrar() {
    const t = total(); if (!t) return;
    const m = medios(MEDIOS_VENTA).find(x => x.codigo === medioVenta);
    const monto = cond === 'CREDITO' ? r2($('#inicial').value) : t;
    if (cond === 'CONTADO' && medioVenta === 'EFECTIVO' && recibido !== '' && num(recibido) < t) return aviso('Lo recibido no alcanza para el total', true);
    const perdidas = ticket.filter(x => evalMargen(x.precio, costoDe(x.producto_id, x.factor))?.nivel === 'perdida');
    if (perdidas.length && !(await dialogo('Vas a vender bajo el costo', [{ type: 'info', html: `<p class="sub" style="margin:0">${perdidas.map(x => `<b>${esc(x.nombre)} (${esc(x.pres)})</b>: precio ${S(x.precio)}, te cuesta ${S(costoDe(x.producto_id, x.factor))}`).join('<br>')}</p>` }], 'Vender igual'))) return;
    if (medioVenta === 'EFECTIVO' && monto > 0 && !(await sesionCaja())) {
      if (!(await abrirCajaRapido())) return;
    }
    const p = {
      cliente_id: cond === 'CREDITO' ? $('#cliCred').value : generico?.id,
      condicion: cond,
      lineas: ticket.map(x => Object.assign({ presentacion_id: x.presentacion_id, cantidad: x.cantidad }, x.precio !== x.lista ? { precio_unitario: x.precio } : {})),
      pagos: monto > 0 ? [{ metodo_pago_id: m.id, monto, referencia: $('#opRef')?.value || null }] : [],
    };
    if (cond === 'CREDITO') p.fecha_vencimiento = $('#vence').value;
    $('#btnCobrar').disabled = true;
    const r = await rpc('registrar_venta', { p });
    if (!r.ok) { $('#btnCobrar').disabled = false; return; }
    const vuelto = medioVenta === 'EFECTIVO' && cond === 'CONTADO' && num(recibido) > t ? r2(num(recibido) - t) : 0;
    $('#ticket').innerHTML = `<div class="hecho"><div class="ic">✓</div><p class="sub" style="margin:0">${cond === 'CREDITO' ? 'Fiado registrado' : 'Cobrado con ' + esc(m.nombre)}</p>
      <b>${S(t)}</b>${vuelto ? `<div class="vuelto" style="margin-top:14px"><span>Vuelto</span><b>${S(vuelto)}</b></div>` : ''}
      <button class="btn rotulo cobrar" id="nueva" style="margin-top:16px">Nueva venta</button></div>`;
    ticket = []; recibido = ''; cond = 'CONTADO'; $('#barraMovil').classList.remove('ver');
    $('#nueva').onclick = () => ir('vender'); $('#nueva').focus();
  }
  $('#buscar').oninput = pintarEstante;
  $('#buscar').onkeydown = e => { if (e.key === 'Enter') { const b = $('#estante .opc:not(:disabled)'); b && b.click(); $('#buscar').select(); } };
  pintarTodo();
}

  <div class="panel"><h2>Ventas</h2><p class="sub">Las últimas 80. Anular devuelve todo el stock y el dinero; Devolver permite devolver solo una parte.</p><div class="scroll"><table>
    <tr><th>Venta</th><th>Fecha</th><th>Cliente</th><th class="n">Total</th><th class="n">Ganancia</th><th>Estado</th><th></th></tr>
    ${ventas.map(v => `<tr><td>${esc(v.documento)}</td><td>${fh(v.fecha)}</td><td>${esc(v.cliente)}${v.condicion === 'CREDITO' ? ' <span class="chip aviso">fiado</span>' : ''}</td>
      <td class="n">${S(v.total)}</td><td class="n">${v.estado === 'EMITIDA' ? S(num(v.total) - num(v.costo_ventas)) : ''}</td>

      <td class="n" style="white-space:nowrap">${v.estado === 'EMITIDA' ? `<button class="btn claro mini" data-dev="${v.venta_id}" data-doc="${esc(v.documento)}">Devolver</button> ` : ''}${v.estado === 'EMITIDA' && num(v.importe_devuelto) === 0 ? `<button class="btn claro mini" data-anular="${v.venta_id}">Anular</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="7" class="vacio">Todavía no hay ventas. Registra la primera en Vender.</td></tr>'}
  </table></div></div>`;
  el.querySelectorAll('[data-cobrar]').forEach(b => b.onclick = async () => {

    if (!v) return;
    if (C.metodos.find(m => m.id == v[0])?.codigo === 'EFECTIVO' && !(await sesionCaja()) && !(await abrirCajaRapido())) return;
    if ((await rpc('registrar_cobro', { p_venta_id: b.dataset.cobrar, p_metodo_pago_id: Number(v[0]), p_monto: r2(v[1]), p_referencia: v[2] || null }, 'Cobro registrado')).ok) ir('ventas');
  });
  el.querySelectorAll('[data-anular]').forEach(b => b.onclick = async () => {
    const v = await dialogo('Anular venta', [{ type: 'info', html: '<p class="sub" style="margin:0">El stock vuelve al inventario y el dinero cobrado sale de la cuenta donde entró.</p>' }, { label: 'Motivo', required: true }], 'Anular venta');
    if (v && (await rpc('anular_venta', { p_venta_id: b.dataset.anular, p_motivo: v[1] }, 'Venta anulada')).ok) ir('ventas');
  });
  el.querySelectorAll('[data-dev]').forEach(b => b.onclick = () => devolverVenta(b.dataset.dev, b.dataset.doc).catch(e => aviso(textoError(e), true)));
}
async function devolverVenta(ventaId, doc) {
  const [lineas, prev, tot] = await Promise.all([
    q(sb.from('venta_detalles').select('id, linea, cantidad, subtotal, presentacion_id').eq('venta_id', ventaId).order('linea')),
    q(sb.from('devolucion_venta_detalles').select('venta_detalle_id, cantidad, importe, devoluciones_venta!inner(venta_id)').eq('devoluciones_venta.venta_id', ventaId)),
    q(sb.from('v_ventas_totales').select('saldo, cobros_netos').eq('venta_id', ventaId).single()),
  ]);
  const ya = {}; prev.forEach(p => { const o = ya[p.venta_detalle_id] ??= { c: 0, i: 0 }; o.c += num(p.cantidad); o.i += num(p.importe); });
  const nombre = id => { const p = C.presentaciones.find(x => x.id === id); return p ? presNombre(p) : 'Producto'; };
  const disp = lineas.map(l => ({ ...l, max: num(l.cantidad) - num(ya[l.id]?.c) })).filter(l => l.max > 0);
  if (!disp.length) return aviso('Esta venta ya fue devuelta por completo', true);
  const campos = disp.map(l => ({ label: `${nombre(l.presentacion_id)} (puede devolver hasta ${N(l.max)})`, type: 'number', value: 0 }));
  campos.push({ label: '¿Cómo vuelve el producto?', type: 'select', options: [{ value: 'si', label: 'En buen estado, se puede vender' }, { value: 'no', label: 'Dañado, se registra como merma' }] });
  campos.push({ label: 'Motivo', required: true });
  campos.push({ label: 'Si hay que devolver dinero, ¿por dónde?', type: 'select', options: opcMedios(MEDIOS_VENTA) });
  const v = await dialogo('Devolución de la venta ' + doc, campos, 'Registrar devolución');
  if (!v) return;
  const nd = disp.length, reing = v[nd] === 'si', motivo = v[nd + 1], met = Number(v[nd + 2]);
  const sel = disp.map((l, i) => ({ l, c: num(v[i]) })).filter(x => x.c > 0);
  if (!sel.length) return aviso('Indica cuántas unidades devuelve', true);
  const mal = sel.find(x => x.c > x.l.max || x.c !== Math.trunc(x.c));
  if (mal) return aviso(`Cantidad inválida para ${nombre(mal.l.presentacion_id)} (máximo ${N(mal.l.max)})`, true);
  const total = r2(sel.reduce((a, { l, c }) => a + (c === l.max ? num(l.subtotal) - num(ya[l.id]?.i) : r2(num(l.subtotal) * c / num(l.cantidad))), 0));
  const forma = num(tot.saldo) >= total ? 'REDUCE_SALDO' : 'DINERO';
  if (forma === 'DINERO' && total > num(tot.cobros_netos)) return aviso('El valor devuelto supera lo cobrado y lo pendiente de esta venta', true);
  if (forma === 'DINERO' && C.metodos.find(m => m.id == met)?.codigo === 'EFECTIVO' && !(await sesionCaja()) && !(await abrirCajaRapido())) return;
  const p = { venta_id: ventaId, motivo, forma_reembolso: forma, lineas: sel.map(({ l, c }) => ({ venta_detalle_id: l.id, cantidad: c, reingresa_stock: reing })),
    reembolsos: forma === 'DINERO' ? [{ metodo_pago_id: met, monto: total }] : [] };
  if ((await rpc('registrar_devolucion_venta', { p }, forma === 'DINERO' ? `Devolución registrada. Entrega ${S(total)} al cliente` : `Devolución registrada. Su deuda bajó ${S(total)}`)).ok) ir('ventas');
}

async function devolverCompra(compraId, tarjeta) {

    q(sb.from('compra_detalles').select('id, linea, cantidad, importe_neto, igv_monto, presentacion_id').eq('compra_id', compraId).order('linea')),
    q(sb.from('devolucion_compra_detalles').select('compra_detalle_id, cantidad, importe, devoluciones_compra!inner(compra_id)').eq('devoluciones_compra.compra_id', compraId)),
    q(sb.from('v_compras_totales').select('saldo, proveedor').eq('compra_id', compraId).single()),
  ]);
  const ya = {}; prev.forEach(p => { const o = ya[p.compra_detalle_id] ??= { c: 0, i: 0 }; o.c += num(p.cantidad); o.i += num(p.importe); });
  const nombre = id => { const p = C.presentaciones.find(x => x.id === id); return p ? presNombre(p) : 'Producto'; };
  const disp = lineas.map(l => ({ ...l, bruto: num(l.importe_neto) + num(l.igv_monto), max: num(l.cantidad) - num(ya[l.id]?.c) })).filter(l => l.max > 0);
  if (!disp.length) return aviso('Esta compra ya fue devuelta por completo', true);
  const campos = disp.map(l => ({ label: `${nombre(l.presentacion_id)} (puedes devolver hasta ${N(l.max)})`, type: 'number', value: 0 }));
  campos.push({ label: 'Motivo', required: true });
  const v = await dialogo('Devolver a ' + tot.proveedor, campos, 'Registrar devolución');
  if (!v) return;
  const motivo = v[disp.length];
  const sel = disp.map((l, i) => ({ l, c: num(v[i]) })).filter(x => x.c > 0);
  if (!sel.length) return aviso('Indica cuántas unidades devuelves', true);
  const mal = sel.find(x => x.c > x.l.max);
  if (mal) return aviso(`Cantidad inválida para ${nombre(mal.l.presentacion_id)} (máximo ${N(mal.l.max)})`, true);
  const total = r2(sel.reduce((a, { l, c }) => a + (c === l.max ? l.bruto - num(ya[l.id]?.i) : r2(l.bruto * c / num(l.cantidad))), 0));
  const reint = r2(Math.max(0, total - num(tot.saldo)));
  const p = { compra_id: compraId, motivo, lineas: sel.map(({ l, c }) => ({ compra_detalle_id: l.id, cantidad: c })), reintegros: reint > 0 ? [{ metodo_pago_id: tarjeta.id, monto: reint }] : [] };
  if ((await rpc('registrar_devolucion_compra', { p }, reint > 0 ? `Devolución registrada. El proveedor te devuelve ${S(reint)} a la tarjeta` : `Devolución registrada. Tu deuda bajó ${S(total)}`)).ok) ir('compras');
}

const normTexto = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

// Busca líneas con: [cantidad] descripción ... precio_unitario importe
function extraerLineas(texto) {
  const out = [], NUM = /\d{1,3}(?:[.,]\d{3})*[.,]\d{2,4}|\d+(?:[.,]\d+)?/g;
  const NO = /(sub ?total|gravad|exonerad|inafect|i\.?g\.?v|total|son:|vuelto|efectivo|tarjeta|r\.?u\.?c|fecha|hora|telef|direcc|serie|boleta|factura|cliente|se[nñ]or|cajero|redondeo|descuento|anticipo|pagina|www|representaci)/i;

    if (l.length < 6 || NO.test(l)) continue;
    const decimales = [...l.matchAll(/\d{1,3}(?:[.,]\d{3})*[.,]\d{2,4}(?!\d)/g)];
    if (decimales.length < 1) continue;
    const importe = aNumero(decimales.at(-1)[0]);
    let pu = decimales.length >= 2 ? aNumero(decimales.at(-2)[0]) : null;
    const ini = l.match(/^(\d+(?:[.,]\d+)?)\s+/);
    let cant = ini ? aNumero(ini[1]) : null;
    if (!cant && pu) cant = Math.round(importe / pu * 100) / 100;
    if (cant && !pu) pu = r2(importe / cant);
    if (!cant || !pu || !(importe > 0)) continue;
    const cuadra = Math.abs(cant * pu - importe) <= Math.max(0.06, importe * 0.02);
    if (!cuadra && decimales.length >= 3) { // a veces: cant | pu | dscto | importe

    if (normTexto(desc).length < 3) continue;
    out.push({ texto: desc, cantidad: cant, costo: r2(pu), importe: r2(importe), cuadra: Math.abs(cant * pu - importe) <= Math.max(0.06, importe * 0.02) });

}

// Empareja el texto de la factura con tus presentaciones (alias aprendidos primero)
function emparejar(desc, alias, comprables) {
  const n = normTexto(desc);
  if (alias[n]) return { id: alias[n], por: 'aprendido' };
  const tok = new Set(n.split(' ').filter(t => t.length > 1));
  let mejor = null, puntaje = 0;
  for (const p of comprables) {
    const nombre = normTexto(p.productos.nombre).split(' ').filter(t => t.length > 1 && !['de', 'la', 'el', 'x'].includes(t));
    if (!nombre.length) continue;
    let s = nombre.filter(t => tok.has(t) || [...tok].some(k => k.length > 3 && (k.startsWith(t) || t.startsWith(k)))).length / nombre.length;
    if (num(p.factor) > 1 && (tok.has(String(num(p.factor))) || tok.has('x' + num(p.factor)))) s += 0.15;
    if (s > puntaje) { puntaje = s; mejor = p; }

    if ($('#escProvSel')) $('#escProvSel').onchange = async () => { prov = C.proveedores.find(p => p.id === $('#escProvSel').value) || null; if (prov) { alias = await cargarAlias(prov.id); lineas.forEach(l => { if (!l.id) Object.assign(l, emparejar(l.texto, alias, comprables)); }); } pintar(); };
    if ($('#escCrearProv')) $('#escCrearProv').onclick = async () => {
      const nom = $('#escProvNom').value.trim(), r = $('#escProvRuc').value.trim();
      if (!nom) return aviso('Escribe el nombre del proveedor', true);
      if (r && !/^\d{11}$/.test(r)) return aviso('El RUC debe tener 11 dígitos', true);
      try {
        prov = await q(sb.from('proveedores').insert({ razon_social: nom, tipo_documento: r ? 'RUC' : null, numero_documento: r || null }).select().single());
        C.proveedores.push(prov); C.proveedores.sort((a, b) => a.razon_social.localeCompare(b.razon_social));
        aviso('Proveedor creado'); pintar();
      } catch (er) { aviso(textoError(er), true); }
    };
    $('#escUsar').onclick = async () => {
      if (!prov) return aviso('Primero crea o elige el proveedor', true);
      const usar = lineas.filter(l => l.incluir && l.id && l.cantidad > 0);
      if (!usar.length) return aviso('Elige al menos un producto', true);
      if (usar.some(l => !(l.costo > 0))) return aviso('Hay productos sin costo', true);
      if (duplicada && !(await dialogo('Esta factura ya está registrada', [{ type: 'info', html: '<p class="sub" style="margin:0">Si sigues, la compra y el stock se sumarán dos veces.</p>' }], 'Seguir igual'))) return;
      // Aprender: texto de la factura -> producto elegido
      const aprender = usar.filter(l => l.texto !== '(agregada a mano)').map(l => ({ proveedor_id: prov.id, texto: normTexto(l.texto).slice(0, 200), presentacion_id: l.id, actualizado_en: new Date().toISOString() })).filter(a => a.texto.length >= 2);
      const unicos = Object.values(Object.fromEntries(aprender.map(a => [a.texto, a])));
      if (unicos.length) await q(sb.from('alias_compra').upsert(unicos, { onConflict: 'proveedor_id,texto' })).catch(er => aviso('No pude guardar lo aprendido: ' + textoError(er), true));
      lineasCompra = usar.map(l => ({ presentacion_id: l.id, cantidad: l.cantidad, costo: String(l.costo) }));
      const suma = usar.reduce((a, l) => a + r2(l.cantidad * l.costo), 0);
      const igv = qr?.total && qr.igv > 0 && Math.abs(r2(suma * 1.18) - qr.total) < Math.abs(suma - qr.total) ? '0.18' : '0';
      cabeceraEscaneada = { proveedor_id: prov.id, fecha: qr?.fecha || null, tipo_comprobante_id: tc?.id, serie: qr?.serie, numero: qr?.numero, igv };
      URL.revokeObjectURL(url);
      await ir('compras');
      aviso('Compra lista. Revísala y toca Registrar compra.');
    };
  };
  pintar();
  caja.scrollIntoView({ behavior: 'smooth' });
}

      <div class="fila" style="margin-top:8px"><div><label>Categoría</label><select id="pCat">${C.categorias.map(c => `<option value="${c.id}">${esc(c.nombre)}</option>`).join('')}</select></div>
        <div><label>Se cuenta por</label><select id="pUni">${C.unidades.map(u => `<option value="${u.id}">${esc(u.nombre)}</option>`).join('')}</select></div>

    if (v) { const nuevo = num(v[v.length - 1]), e = evalMargen(nuevo, k);
      if (e && e.nivel !== 'ok' && !(await dialogo(e.nivel === 'perdida' ? 'Ese precio está bajo el costo' : 'Ese precio deja poco margen', [{ type: 'info', html: `<p class="sub" style="margin:0">Con ${S(nuevo)} tu margen sería ${chipMargen(e)}. Precio mínimo: ${S(precioSugerido(k))}.</p>` }], 'Usar este precio'))) return;
      v[0] = v[v.length - 1]; }
    if (v && (await rpc('establecer_precio_venta', { p_presentacion_id: b.dataset.precio, p_precio: r2(v[0]) }, 'Precio cambiado')).ok) ir('catalogo');
  });
  $('#guardarUmbral').onclick = () => { const v = Math.round(num($('#umbral').value)); if (v < 1 || v > 90) return aviso('Escribe un porcentaje entre 1 y 90', true); fijarUmbral(v); aviso(`Margen mínimo: ${v}%`); ir('catalogo'); };

    if (pkN && pkF < 2) return aviso('El paquete debe traer al menos 2 unidades', true);

      const prod = await q(sb.from('productos').insert({ sku, nombre: nom, categoria_id: $('#pCat').value, unidad_base_id: Number($('#pUni').value), stock_minimo: num($('#pMin').value) }).select().single());
      const filas = [{ producto_id: prod.id, nombre: 'Unidad', factor: 1, es_base: true, se_compra: !pkN, se_vende: pu !== '' }];
      if (pkN) filas.push({ producto_id: prod.id, nombre: pkN, factor: pkF, es_base: false, se_compra: true, se_vende: pkP !== '' });
      const pres = await q(sb.from('presentaciones').insert(filas).select());
      for (const p of pres) { const pr = p.es_base ? pu : pkP; if (pr !== '') await q(sb.rpc('establecer_precio_venta', { p_presentacion_id: p.id, p_precio: r2(pr) })); }
      aviso('Producto creado'); await cargarCatalogos(); ir('catalogo');
    } catch (e) { aviso(textoError(e), true); }

  $('#btnCli').onclick = async () => {
    const v = await dialogo('Nuevo cliente', [{ label: 'Nombre', required: true },
      { label: 'Documento', type: 'select', options: [{ value: '', label: 'Sin documento' }, { value: 'DNI', label: 'DNI' }, { value: 'RUC', label: 'RUC' }] },
      { label: 'Número' }, { label: 'Teléfono' },
      { label: '¿Le fías?', type: 'select', options: [{ value: 'si', label: 'Sí' }, { value: 'no', label: 'No' }] },
      { label: 'Fiado máximo en S/ (vacío = sin límite)', type: 'number' }]);
    if (!v) return;
    try {
      await q(sb.from('clientes').insert({ nombre: v[0].trim(), tipo_documento: v[1] || null, numero_documento: v[1] ? v[2] : null, telefono: v[3] || null,
        permite_credito: v[4] === 'si', limite_credito: v[4] === 'si' && v[5] !== '' ? r2(v[5]) : null }));
      aviso('Cliente creado'); await cargarCatalogos(); ir('catalogo');
    } catch (e) { aviso(textoError(e), true); }
  };
}

  const correr = async () => {

// Trae todas las filas (Supabase entrega de 1000 en 1000)
async function todo(armar) {
  const out = [];
  for (let i = 0; ; i += 1000) { const d = await q(armar().range(i, i + 999)); out.push(...d); if (d.length < 1000) break; }
  return out;
}
const fechaHora = t => t ? new Date(t).toLocaleString('es-PE', { timeZone: 'America/Lima', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }) : '';
async function exportarExcel(d, h) {
  if (typeof XLSX === 'undefined') throw new Error('no cargó la librería de Excel; revisa tu conexión');
  const desde = d + 'T00:00:00-05:00', hasta = h + 'T23:59:59.999-05:00';
  const [dias, ventas, movs, compras, gastos, kardex, existencias, precios] = await Promise.all([
    todo(() => sb.from('v_resultados_diarios').select('*').gte('fecha', d).lte('fecha', h).order('fecha')),
    todo(() => sb.from('v_ventas_totales').select('*').gte('fecha', desde).lte('fecha', hasta).order('fecha')),
    todo(() => sb.from('movimientos_financieros').select('*').gte('fecha', desde).lte('fecha', hasta).order('fecha')),
    todo(() => sb.from('v_compras_totales').select('*').gte('fecha_ingreso', desde).lte('fecha_ingreso', hasta).order('fecha_ingreso')),
    todo(() => sb.from('gastos').select('*, categorias_gasto(nombre)').gte('fecha', d).lte('fecha', h).order('fecha')),
    todo(() => sb.from('v_kardex').select('*').gte('fecha', desde).lte('fecha', hasta).order('fecha').order('secuencia')),
    q(sb.from('v_existencias').select('*').eq('activo', true).order('producto')),
    q(sb.from('v_precios_vigentes').select('*')),
  ]);
  // Detalle de cada venta
  const ids = ventas.map(v => v.venta_id), lineas = [];
  for (let i = 0; i < ids.length; i += 150) lineas.push(...await todo(() => sb.from('venta_detalles').select('*').in('venta_id', ids.slice(i, i + 150)).order('linea')));
  const venta = Object.fromEntries(ventas.map(v => [v.venta_id, v]));
  const pres = Object.fromEntries(C.presentaciones.map(p => [p.id, p]));
  const cuenta = Object.fromEntries(C.cuentas.map(c => [c.id, c.nombre]));
  const s = k => r2(dias.reduce((a, x) => a + num(x[k]), 0));
  const nombreTipo = t => String(t || '').replaceAll('_', ' ').toLowerCase().replace(/^./, c => c.toUpperCase());

  const libro = XLSX.utils.book_new();
  const SOLES = '"S/" #,##0.00;[Red]-"S/" #,##0.00', PCT = '0.0"%"', CU = '0.0000', ENT = '#,##0';
  const formatoDe = h => /%/.test(h) ? PCT : /^Costo (unitario|promedio)$/.test(h) ? CU
    : /^(Cantidad|Stock|Saldo cantidad)/.test(h) ? ENT
    : /(Venta|Costo|Ganancia|Gastos|Precio|Importe|Monto|Total|Devuelto|Por pagar|Valor)/i.test(h) ? SOLES : null;
  const SUMABLES = /^(Ventas netas|Costo de lo vendido|Ganancia bruta|Gastos|Ganancia neta|Cantidad|Importe|Costo|Ganancia|Monto|Total|Devuelto|Por pagar|Costo total|Valor del stock)$/;
  // filas: arreglo de objetos (tabla) o de arreglos (Resumen). totales: agrega fila TOTAL con fórmulas SUMA.
  const hoja = (nombre, filas, anchos, totales) => {
    const tabla = !Array.isArray(filas[0]);
    const ws = tabla ? XLSX.utils.json_to_sheet(filas.length ? filas : [{ 'Sin datos en estas fechas': '' }]) : XLSX.utils.aoa_to_sheet(filas);
    const enc = tabla ? Object.keys(filas[0] || { 'Sin datos en estas fechas': '' }) : [];
    const cols = tabla ? enc.length : Math.max(...filas.map(f => f.length));
    ws['!cols'] = Array.from({ length: cols }, (_, i) => ({ wch: anchos?.[i] ?? 14 }));
    if (tabla && filas.length) {
      const n = filas.length; // datos en filas 2..n+1
      enc.forEach((h, c) => {
        const z = formatoDe(h); if (!z) return;
        for (let r = 1; r <= n; r++) { const cel = ws[XLSX.utils.encode_cell({ r, c })]; if (cel && cel.t === 'n') cel.z = z; }
      });
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: n, c: cols - 1 } }) };
      if (totales) {
        const r = n + 1;
        ws[XLSX.utils.encode_cell({ r, c: 0 })] = { t: 's', v: 'TOTAL' };
        enc.forEach((h, c) => {
          if (c === 0 || !SUMABLES.test(h)) return;
          const col = XLSX.utils.encode_col(c);
          ws[XLSX.utils.encode_cell({ r, c })] = { t: 'n', f: `SUBTOTAL(9,${col}2:${col}${n + 1})`, z: formatoDe(h) || undefined };
        });
        ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r, c: cols - 1 } });
      }
    }
    if (!tabla) filas.forEach((f, r) => { const cel = ws[XLSX.utils.encode_cell({ r, c: 1 })]; if (cel && cel.t === 'n') cel.z = /%/.test(f[0]) ? PCT : /realizadas/.test(f[0]) ? ENT : SOLES; });
    XLSX.utils.book_append_sheet(libro, ws, nombre);
  };
  const vn = s('ventas_netas');
  hoja('Resumen', [
    ['Estado de resultados', `Del ${fd(d)} al ${fd(h)}`],
    [],
    ['Ventas', s('ventas_brutas')], ['(−) Devoluciones', -s('devoluciones')], ['Ventas netas', vn],
    ['(−) Costo de lo vendido', -s('costo_mercaderia_vendida')], ['   de ello, mermas y ajustes', -s('de_ello_mermas_ajustes')],
    ['Ganancia bruta', s('utilidad_bruta')], ['Margen bruto %', vn ? r2(s('utilidad_bruta') / vn * 100) : 0],
    ['(−) Gastos operativos', -s('gastos_operativos')], ['(−) Gastos administrativos', -s('gastos_administrativos')],
    ['(−) Gastos financieros', -s('gastos_financieros')], ['(−) Otros egresos', -s('otros_egresos')],
    ['Ganancia neta', s('utilidad_neta_estimada')], ['Margen neto %', vn ? r2(s('utilidad_neta_estimada') / vn * 100) : 0],
    ['Consumo del dueño (retiro en especie)', s('retiro_en_especie')],
    [], ['Ventas realizadas', ventas.filter(v => v.estado === 'EMITIDA').length],
    ['Generado', fechaHora(new Date())],
  ], [38, 18]);
  hoja('Por día', dias.map(x => ({ Fecha: fd(x.fecha), 'Ventas netas': num(x.ventas_netas), 'Costo de lo vendido': num(x.costo_mercaderia_vendida), 'Ganancia bruta': num(x.utilidad_bruta),
    'Margen %': num(x.ventas_netas) ? r2(num(x.utilidad_bruta) / num(x.ventas_netas) * 100) : 0,
    Gastos: r2(num(x.gastos_operativos) + num(x.gastos_administrativos) + num(x.gastos_financieros) + num(x.otros_egresos)), 'Ganancia neta': num(x.utilidad_neta_estimada) })), [12, 14, 18, 15, 10, 12, 14], true);
  hoja('Ventas', lineas.filter(l => venta[l.venta_id]?.estado !== 'ANULADA').map(l => { const v = venta[l.venta_id] || {}, p = pres[l.presentacion_id], sub = num(l.subtotal), costo = num(l.costo_total);
    return { Fecha: fechaHora(v.fecha), Venta: v.documento, Cliente: v.cliente, Condición: v.condicion, Producto: p?.productos.nombre || '', Presentación: p?.nombre || '',
      Cantidad: num(l.cantidad), 'Precio unitario': num(l.cantidad) ? r2(sub / num(l.cantidad)) : 0, Importe: sub, Costo: costo, Ganancia: r2(sub - costo),
      'Margen %': sub ? r2((sub - costo) / sub * 100) : 0, Estado: v.estado }; }), [17, 14, 16, 10, 24, 15, 9, 13, 10, 10, 10, 9, 10], true);
  hoja('Cobros y pagos', movs.map(m => ({ Fecha: fechaHora(m.fecha), Movimiento: nombreTipo(m.tipo), Medio: nombreMedio(m.metodo_pago_id), Cuenta: cuenta[m.cuenta_financiera_id] || '',
    Monto: num(m.monto), Detalle: m.descripcion || m.referencia || '' })), [17, 24, 26, 20, 11, 34], true);
  hoja('Compras', compras.map(c => ({ Fecha: fechaHora(c.fecha_ingreso), Proveedor: c.proveedor, Comprobante: [c.serie, c.numero].filter(Boolean).join('-'), Total: num(c.total),
    Devuelto: num(c.importe_devuelto), 'Por pagar': num(c.saldo), Estado: c.estado })), [17, 26, 14, 11, 11, 11, 12], true);
  hoja('Gastos', gastos.map(g => ({ Fecha: fd(g.fecha), Categoría: g.categorias_gasto?.nombre || '', Detalle: g.descripcion, Monto: num(g.monto), Estado: g.estado })), [12, 22, 34, 11, 12], true);
  hoja('Kardex', kardex.map(k => ({ Fecha: fechaHora(k.fecha), Producto: k.producto, Movimiento: nombreTipo(k.tipo), Motivo: k.motivo || '', Cantidad: num(k.cantidad_base),
    'Costo unitario': num(k.costo_unitario), 'Costo total': num(k.costo_total), 'Saldo cantidad': num(k.saldo_cantidad), 'Saldo valor': num(k.saldo_valor), 'Costo promedio': num(k.costo_promedio) })), [17, 24, 22, 18, 10, 13, 12, 13, 12, 13]);
  hoja('Stock y márgenes', precios.filter(p => p.precio != null).sort((a, b) => a.producto.localeCompare(b.producto) || a.factor - b.factor).map(p => {
    const e = existencias.find(x => x.producto_id === p.producto_id), costo = r2(num(e?.costo_promedio) * num(p.factor)), m = evalMargen(num(p.precio), costo);
    return { Producto: p.producto, Presentación: p.presentacion, 'Stock (unidades)': num(e?.cantidad), Costo: costo, Precio: num(p.precio), 'Margen %': m ? r2(m.m) : '',
      'Precio mínimo': costo > 0 ? precioSugerido(costo) : '', 'Valor del stock': num(e?.valor_total) };
  }), [24, 15, 15, 10, 10, 10, 13, 14]);
  XLSX.writeFile(libro, `Caja_${d}_a_${h}.xlsx`);
  aviso('Excel descargado');
}

async function factorVerificado() {

  return (data?.totp || []).find(f => f.status === 'verified') || null;

async function necesitaCodigo() {

  return data.nextLevel === 'aal2' && data.currentLevel !== 'aal2';
}
// Muestra la pantalla del código; resuelve true si se verificó, false si se canceló
function pedirCodigo() {
  return new Promise(res => {
    $('#ingreso').classList.remove('oculto'); $('#app').classList.add('oculto');
    $('#fIngreso').classList.add('oculto'); $('#fCodigo').classList.remove('oculto');
    const inp = $('#codigo'); inp.value = ''; setTimeout(() => inp.focus(), 50);
    inp.oninput = () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 6); if (inp.value.length === 6) $('#fCodigo').requestSubmit(); };
    let ocupado = false;
    $('#fCodigo').onsubmit = async e => {
      e.preventDefault();
      if (ocupado) return;
      const code = inp.value.replace(/\D/g, '');
      if (code.length !== 6) return aviso('El código tiene 6 dígitos', true);
      ocupado = true; const btn = $('#fCodigo button[type=submit]'); btn.disabled = true;
      try {
        const f = await factorVerificado();
        if (!f) throw new Error('No hay un autenticador activo en tu cuenta');
        const { error } = await sb.auth.mfa.challengeAndVerify({ factorId: f.id, code });
        if (error) throw error;
        $('#fCodigo').classList.add('oculto'); $('#fIngreso').classList.remove('oculto');
        res(true);
      } catch (err) {
        aviso(/invalid|expired|incorrect/i.test(err.message || '') ? 'Código incorrecto o vencido. Escribe el código que muestra ahora tu app.' : textoError(err), true);
        inp.value = ''; inp.focus();
      }
      ocupado = false; btn.disabled = false;
    };
    $('#cancelarCodigo').onclick = async e => {
      e.preventDefault();
      await sb.auth.signOut();
      $('#fCodigo').classList.add('oculto'); $('#fIngreso').classList.remove('oculto');
      res(false);
    };
  });
}
const contraseñaValida = c => c.length >= 10 && /[a-z]/.test(c) && /[A-Z]/.test(c) && /\d/.test(c);
const REGLAS_CLAVE = 'Mínimo 10 caracteres, con al menos una mayúscula, una minúscula y un número.';
async function guardarContraseña(c1, c2) {
  if (c1 !== c2) { aviso('Las contraseñas no coinciden', true); return false; }
  if (!contraseñaValida(c1)) { aviso(REGLAS_CLAVE, true); return false; }
  const { error } = await sb.auth.updateUser({ password: c1 });
  if (error) {
    aviso(/reauthenticat|recent/i.test(error.message) ? 'Por seguridad, sal y vuelve a entrar antes de cambiar la contraseña.'
      : /aal2|AAL2/.test(error.message) ? 'Primero verifica tu código de dos pasos.'
      : /weak|characters|should contain/i.test(error.message) ? REGLAS_CLAVE : error.message, true);
    return false;
  }
  aviso('Contraseña cambiada'); return true;
}

// ============ CUENTA ============
async function vCuenta(el) {
  const [{ data: u }, { data: fs }] = await Promise.all([sb.auth.getUser(), sb.auth.mfa.listFactors()]);
  const verificados = (fs?.totp || []).filter(f => f.status === 'verified');
  el.innerHTML = `
  <div class="cols dos">
    <div class="panel"><h2>Verificación en dos pasos</h2>
      ${verificados.length ? `<p><span class="chip ok">Activada</span></p>
        <p class="sub">Cada vez que entres, la app te pedirá el código de 6 dígitos de tu app autenticadora. Sin ese código nadie puede ver ni registrar nada, aunque sepa tu contraseña.</p>
        <table>${verificados.map(f => `<tr><td>${esc(f.friendly_name || 'Autenticador')}</td><td class="sub">desde ${fd(String(f.created_at).slice(0, 10))}</td><td class="n"><button class="btn claro mini" data-quitar="${esc(f.id)}">Desactivar</button></td></tr>`).join('')}</table>
        <button class="btn claro" id="otro2fa" style="margin-top:12px">Agregar otro celular</button>`
      : `<p><span class="chip mal">Desactivada</span></p>
        <p class="sub">Además de tu contraseña, necesitarás un código que cambia cada 30 segundos en tu celular. Si alguien roba tu contraseña, igual no podrá entrar.</p>
        <button class="btn rotulo" id="activar2fa">Activar verificación en dos pasos</button>`}
      <div id="enrolar"></div>
    </div>
    <div class="panel"><h2>Contraseña</h2><p class="sub">${REGLAS_CLAVE}</p>
      <div class="fila"><div><label for="np1">Nueva contraseña</label><input type="password" id="np1" autocomplete="new-password"></div>
        <div><label for="np2">Repítela</label><input type="password" id="np2" autocomplete="new-password"></div></div>
      <button class="btn" id="cambiarPass" style="margin-top:12px">Cambiar contraseña</button>
      <h3>Sesiones</h3><p class="sub">Tu sesión se cierra sola tras ${MIN_INACTIVIDAD} minutos sin uso. Si perdiste un celular o computadora donde tenías la app abierta, cierra todas las sesiones.</p>
      <button class="btn claro" id="cerrarTodas">Cerrar sesión en todos los dispositivos</button>
      <p class="sub" style="margin:16px 0 0">Cuenta: ${esc(u?.user?.email)}</p>
    </div>
  </div>`;
  const enrolar = async () => {
    try {
      // Limpia intentos anteriores que no se terminaron
      const { data: todos } = await sb.auth.mfa.listFactors();
      for (const f of (todos?.all || []).filter(f => f.status !== 'verified')) await sb.auth.mfa.unenroll({ factorId: f.id });
      const nombre = 'Celular ' + new Date().toLocaleString('es-PE', { timeZone: 'America/Lima', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      const { data: en, error } = await sb.auth.mfa.enroll({ factorType: 'totp', friendlyName: nombre, issuer: 'Caja' });
      if (error) throw error;
      const caja = $('#enrolar');
      ['#activar2fa', '#otro2fa'].forEach(sel => $(sel)?.classList.add('oculto'));
      caja.innerHTML = `<h3>Configura tu celular</h3>
        <ol class="pasos">
          <li>Instala <b>Google Authenticator</b> o <b>Microsoft Authenticator</b> en tu celular.</li>
          <li>En esa app toca <b>+</b> y escanea este código QR. Si estás en el mismo celular, copia la clave y elige "Ingresar clave".</li>
          <li>Escribe abajo el código de 6 dígitos que te muestra.</li>
        </ol>
        <div class="qr"><img id="qrImg" alt="Código QR para tu app autenticadora"><div style="flex:1 1 200px"><label>Clave (para ingresarla a mano)</label><div class="clave" id="clave"></div>
          <button class="btn claro mini" id="copiarClave">Copiar clave</button>
          <p class="sub" style="margin-top:10px"><b>Guarda esta clave en un lugar seguro</b> (por ejemplo, anotada en papel). Si pierdes el celular, con ella puedes volver a agregar la cuenta en otro.</p></div></div>
        <div class="fila"><div><label for="cod2fa">Código de 6 dígitos</label><input id="cod2fa" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="font-size:22px;letter-spacing:.3em"></div>
          <div class="auto"><button class="btn" id="verificar2fa">Verificar y activar</button></div><div class="auto"><button class="btn claro" id="cancelar2fa">Cancelar</button></div></div>`;
      $('#qrImg').src = en.totp.qr_code;
      $('#clave').textContent = en.totp.secret.replace(/(.{4})/g, '$1 ').trim();
      $('#copiarClave').onclick = async () => { try { await navigator.clipboard.writeText(en.totp.secret); aviso('Clave copiada'); } catch { aviso('No se pudo copiar; escríbela a mano', true); } };
      $('#cancelar2fa').onclick = async () => { await sb.auth.mfa.unenroll({ factorId: en.id }).catch(() => {}); ir('cuenta'); };
      const inp = $('#cod2fa'); inp.focus();
      inp.oninput = () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 6); };
      $('#verificar2fa').onclick = async () => {
        if (inp.value.length !== 6) return aviso('Escribe los 6 dígitos', true);
        $('#verificar2fa').disabled = true;
        const { error: e2 } = await sb.auth.mfa.challengeAndVerify({ factorId: en.id, code: inp.value });
        $('#verificar2fa').disabled = false;
        if (e2) return aviso(/invalid|expired/i.test(e2.message) ? 'Código incorrecto. Revisa que la hora de tu celular sea automática y escribe el código actual.' : e2.message, true);
        aviso('Verificación en dos pasos activada'); ir('cuenta');
      };
      caja.scrollIntoView({ behavior: 'smooth' });
    } catch (e) { aviso(textoError(e), true); }
  };
  if ($('#activar2fa')) $('#activar2fa').onclick = enrolar;
  if ($('#otro2fa')) $('#otro2fa').onclick = enrolar;
  el.querySelectorAll('[data-quitar]').forEach(b => b.onclick = async () => {
    const ultimo = verificados.length === 1;
    const v = await dialogo('Desactivar este autenticador', [{ type: 'info', html: `<p class="sub" style="margin:0">${ultimo ? 'Es tu único autenticador: <b>la verificación en dos pasos quedará desactivada</b> y bastará la contraseña para entrar.' : 'Ese celular ya no podrá generar códigos para esta cuenta.'}</p>` }], 'Desactivar');
    if (!v) return;
    const { error } = await sb.auth.mfa.unenroll({ factorId: b.dataset.quitar });
    if (error) return aviso(/aal2/i.test(error.message) ? 'Sal y vuelve a entrar con tu código antes de desactivarlo.' : error.message, true);
    aviso('Autenticador desactivado'); ir('cuenta');
  });
  $('#cambiarPass').onclick = async () => { if (await guardarContraseña($('#np1').value, $('#np2').value)) { $('#np1').value = ''; $('#np2').value = ''; } };
  $('#cerrarTodas').onclick = async () => {
    const v = await dialogo('Cerrar todas las sesiones', [{ type: 'info', html: '<p class="sub" style="margin:0">Se cerrará la app en todos tus dispositivos, incluido este. Tendrás que volver a entrar.</p>' }], 'Cerrar todas');
    if (!v) return;
    await sb.auth.signOut({ scope: 'global' }); location.reload();
  };
}

// ============ Sesión ============
let entrando = false;
async function entrar(session) {
  if (entrando || !session) return;
  entrando = true;
  try {
    if (await necesitaCodigo()) { if (!(await pedirCodigo())) return; }
    const perfil = await q(sb.from('perfiles').select('nombre, activo, roles(codigo)').eq('id', session.user.id).maybeSingle());
    if (!perfil?.activo) { aviso('Tu usuario no tiene un perfil activo en el sistema', true); await sb.auth.signOut(); return; }
    if (recuperacionPendiente) {
      recuperacionPendiente = false;
      let listo = false;
      while (!listo) {
        const v = await dialogo('Crea tu nueva contraseña', [{ type: 'info', html: `<p class="sub" style="margin:0">${REGLAS_CLAVE}</p>` },
          { label: 'Nueva contraseña', type: 'password', required: true }, { label: 'Repítela', type: 'password', required: true }], 'Guardar contraseña');
        if (!v) break;
        listo = await guardarContraseña(v[1], v[2]);
      }
    }
    $('#usuario').textContent = perfil.nombre;
    $('#fechaHoy').textContent = new Date().toLocaleDateString('es-PE', { timeZone: 'America/Lima', weekday: 'long', day: 'numeric', month: 'long' });
    $('#ingreso').classList.add('oculto'); $('#app').classList.remove('oculto');
    ultimaActividad = Date.now();
    await cargarCatalogos();
    ir(vistaActual);
  } catch (e) { aviso(textoError(e), true); }
  finally { entrando = false; }
}
$('#fIngreso').onsubmit = async e => {
  e.preventDefault();
  const { data, error } = await sb.auth.signInWithPassword({ email: $('#lEmail').value.trim(), password: $('#lPass').value });
  if (error) return aviso(/Invalid login/i.test(error.message) ? 'Correo o contraseña incorrectos' : error.message, true);
  $('#lPass').value = '';
  entrar(data.session);
};
$('#btnSalir').onclick = async () => { await sb.auth.signOut(); location.reload(); };
$('#olvide').onclick = async e => {
  e.preventDefault();
  const email = $('#lEmail').value.trim();
  if (!email) return aviso('Escribe tu correo arriba y vuelve a tocar el enlace', true);
  if (!location.protocol.startsWith('http')) return aviso('Para recuperar tu contraseña abre la app desde https://sleepdong.github.io/caja/', true);
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  aviso(error ? error.message : 'Te enviamos un correo. Abre el enlace desde este mismo dispositivo antes de 15 minutos.', !!error);
};
sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') recuperacionPendiente = true; });
sb.auth.getSession().then(({ data }) => { if (data.session) entrar(data.session); });
</script>
